<!doctype html>
<html lang="pt-BR">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Página movida</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;

         min-height: 100vh; margin: 0; padding: 24px; }
  main { max-width: 44ch; text-align: center; }
  h1 { font-size: 1.3rem; color: #1F4B3E; margin: 0 0 10px; }
  p { color: #5A5A5A; font-size: .95rem; line-height: 1.6; margin: 0; }
</style>
</head>
<body>
  <main>
    <h1>Esta página foi movida</h1>
    <p>A ferramenta de teste mudou de endereço. Peça o link atualizado a quem
       compartilhou este com você.</p>
  </main>

</html>
